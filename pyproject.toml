[project]
name = "clera"
version = "0.1.0"
description = "CLERA - Compressed Latent Embeddings for Robust Analysis with SINDy Autoencoder"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core PyTorch
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    
    # Scientific Computing
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    
    # Machine Learning
    "scikit-learn>=1.0.0",
    
    # Tensor Utilities
    "jaxtyping>=0.2.0",
    "einops>=0.7.0",
    
    # Progress bars and utilities
    "tqdm>=4.65.0",
    
    # Visualization
    "matplotlib>=3.5.0",
    "networkx>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "ipython>=8.0.0",
    "jupyter>=1.0.0",
]

# TensorFlow implementation (legacy)
tf = [
    "tensorflow>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/torch_impl", "src/core"]

[tool.uv]
dev-dependencies = []

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

